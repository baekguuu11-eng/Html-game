const initial=()=>({version:2,ch:0,r:0,x:92,y:188,f:{},choices:{},actions:[],clues:[],puzzles:{},known:{},ending:null});let s=initial(),started=false,modal=true,keys={},time=0,last=0,walking=false,face=1,noticeEnd=0,volume=.45,ac,bus,ambient;
try{volume=+(localStorage.getItem('abyss_volume')||.45)}catch(e){}
function audio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();bus=ac.createGain();bus.connect(ac.destination);ambient=ac.createGain();ambient.gain.value=.025;ambient.connect(bus);[43,64.5,86.2].forEach((f,i)=>{let o=ac.createOscillator(),a=ac.createGain();o.frequency.value=f;a.gain.value=1/(i+1);o.connect(a);a.connect(ambient);o.start()})}bus.gain.value=volume;ac.resume()}catch(e){}}
function sound(f=420,d=.1,v=.04,type='sine'){if(!ac)return;let o=ac.createOscillator(),a=ac.createGain();o.frequency.value=f;o.type=type;a.gain.setValueAtTime(v,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(bus);o.start();o.stop(ac.currentTime+d)}

function show(title,text,opts=[['계속',close]],tag='ATLAS–7 / FIELD RECORD'){modal=true;keys={};$('veil').style.display='flex';let p=$('panel');p.innerHTML='';let e=document.createElement('div');e.className='eyebrow';e.textContent=tag;let h=document.createElement('h2');h.textContent=title;let t=document.createElement('p');t.textContent=text;let b=document.createElement('div');b.className='choices';p.append(e,h,t,b);opts.forEach(([label,fn,disabled])=>{let bt=document.createElement('button');bt.textContent=label;bt.disabled=!!disabled;bt.onclick=()=>{sound();fn()};b.append(bt)});p.scrollTop=0}

function say(n,t,o){show(n,t,o,'PERSONNEL / '+rooms[s.r])}
function task(){switch(s.ch){case 0:return '한서진에게 현재 상황과 관측 업무를 인계받으세요.';case 1:return !s.f.sonar?'소나를 분석하고 식당의 기록 불일치를 조사하세요.':!s.f.foodClosed?'은별에게 조사 결과를 전달하거나 사건을 종결하세요.':'한서진에게 보고하세요.';case 2:return !s.f.map?'관측창 손상을 조사하고 도면과 대조하세요.':'한서진에게 외벽 손상을 보고하세요.';case 3:return !s.f.power?'설비실에서 내부 배전을 복구하세요.':!s.f.labClosed?'연구동의 격벽 사건을 해결하거나 명시적으로 종결하세요.':'한서진에게 격벽 사건 결과를 보고하세요.';case 4:return !s.f.voice?'통신실에서 마지막 교신을 복원하세요.':'통신 경로와 잠수정을 점검한 뒤 한서진에게 보고하세요.';default:return !s.f.braced?'설비실 수동 격벽으로 하중을 분산하세요.':'통신실 송신기 또는 격납고 승선 해치에서 마지막 행동을 수행하세요.'}}

function title(){show('ABYSS SIGNAL','심해의 신호\n\n연락이 끊긴 연구기지, ATLAS–7.\n중계기를 확인하러 나간 잠수정은 돌아오지 않았다.\n어둠 너머에서 이름 없는 소리가 들린다.\n\n짧은 완결판 · 8개 구역 · 6종 퍼즐 · 3계열 결말\n시간 제한 없음 / 자동저장 / 이어폰 권장',[['새 기록 시작',()=>started?show('새 기록 시작','현재 자동저장을 새 게임으로 대체합니다.',[['시작',newGame],['취소',title]]):newGame()],['저장 기록 이어하기',load],['설정 / 조작',settings]],'A DEEP SEA MYSTERY');$('panel').querySelector('h2').style.cssText='font-size:32px;letter-spacing:4px'}
function newGame(){s=initial();started=true;audio();sync();close();say('관측 지원 기록','당신은 ATLAS–7의 관측 지원 인력이다.\n동료들이 회의를 마치고 관제실에 남아 있다.\n\n사람·장치 가까이에서 [조사]를 누른다.\n방 아래쪽의 문에서 기지 연결 통로로 이동한다.\n기록 메뉴에서 목표와 단서를 확인할 수 있다.\n\n소나 옆에서 한서진이 당신을 기다린다.')}

function settings(){show('설정 / 조작','PC: WASD·방향키 이동 / E·Enter 조사 / Tab 기록 / Esc 닫기\n모바일: 화면 방향키를 누른 채 이동 / 조사 버튼\n\n대화는 전체 자막으로 표시됩니다.\n기다리거나 메뉴를 열어 두어도 사건은 진행되지 않습니다.',[['게임으로',()=>started&&!s.ending?close():title()],['현재 기록 저장',()=>notify(save()?'진행을 저장했습니다.':'브라우저가 저장을 허용하지 않습니다.')],['제목 화면',title]]);let l=document.createElement('label');l.textContent='환경음 / 효과음';let i=document.createElement('input');i.type='range';i.min=0;i.max=1;i.step=.05;i.value=volume;i.oninput=()=>{volume=+i.value;audio();try{localStorage.setItem('abyss_volume',volume)}catch(e){}};l.append(i);$('panel').insertBefore(l,$('panel').querySelector('.choices'))}
function notes(){if(!started)return title();show('조사노트',task(),[['기지 지도',mapUI],['닫기',close]]);s.clues.forEach(k=>{let d=document.createElement('div');d.className='entry';let b=document.createElement('b');b.textContent=evidence[k][0];let p=document.createElement('p');p.textContent=evidence[k][1];d.append(b,p);$('panel').append(d)})}
function accessible(r){return r<3||r===5||s.ch>=2}function mapUI(){show('연결 통로','격벽문을 통해 선택한 구역으로 이동합니다.\n이동과 기다림은 사건을 자동으로 종결하지 않습니다.',rooms.map((r,i)=>[(accessible(i)?'':'잠김 · ')+r+(s.r===i?' · 현재 위치':''),()=>enter(i),!accessible(i)]).concat([['닫기',close]]),'STATION DIRECTORY')}

function chief(){if(s.ch===0)return say('한서진','돌아오기로 한 잠수정과 연락이 안 됩니다.\n관측 기록부터 확인해 주세요. 식당의 은별도 기록 문제를 이야기하더군요.',[['관측 업무를 인계받는다',()=>{s.ch=1;sync();close()}]]);
if(s.ch===1){if(!s.f.sonar)return say('한서진','소나 기록부터 확인해 주세요. 들리는 소리와 추측을 구분해야 합니다.');if(!s.f.foodClosed)return say('한서진','식당의 기록 문제는 미해결입니다. 더 조사하거나 미해결로 보고를 마칠 수 있어요.',[['계속 조사한다',close],['미해결로 사건을 종결한다',()=>{s.f.foodClosed=true;s.choices.food='unresolved';next(2,'연구동과 설비실의 출입이 허가되었다.\n관측창 아래 손상을 도면과 비교하고 오래된 관측 자료를 찾아보자.')}]]);return next(2,'연구동과 설비실의 출입이 허가되었다.\n외벽 손상을 도면과 비교하고 이전 관측 자료를 찾아보자.')}
if(s.ch===2){if(!s.f.map)return say('한서진','관측창의 실제 손상과 기지 도면을 대조해 주세요. 정확한 위치가 필요해요.');return next(3,'분전반이 꺼지고 연구동의 격벽이 멈춘다.\n고예린이 보조 통로 안쪽에 남아 있다.\n\n설비실 배전을 복구하고 연구동 비상 콘솔을 확인하자.')}
if(s.ch===3){if(!s.f.power||!s.f.labClosed)return say('한서진','전력 복구와 연구동 사건의 처리가 필요합니다.\n철수하려면 현장 콘솔에서 봉쇄를 명시해야 해요.');return next(4,s.f.labSaved?'고예린이 보조 통로를 빠져나왔다.\n사람들은 통신 복구와 잠수정 출항을 두고 의견이 갈린다.\n두 경로를 모두 조사할 수 있다.':'연구동이 봉쇄되었다. 고예린과 연결이 끊겼다.\n남은 사람들은 통신 복구와 잠수정 출항을 논의한다.')}
if(s.ch===4){if(!s.f.voice)return say('한서진','먼저 김재민이 보관한 마지막 교신을 복원해 주세요.');return show('최종 대응 보고','구조 경로: '+(s.f.route?'확보됨':'미확보 · 교차 분석 필요')+'\n잠수정: '+(s.f.sub?'점검 완료':'미점검')+'\n연구동: '+(s.f.labSaved?'구조 완료':'봉쇄됨')+'\n\n최종 대응을 시작해도 장비 점검을 계속할 수 있습니다.',[['준비를 더 한다',close],['최종 대응을 시작한다',()=>{next(5,'외벽 접합부에서 길고 낮은 소리가 난다.\n수동 격벽으로 하중을 분산하고 신호를 보내거나, 점검한 잠수정에 승선해야 한다.\n\n장치의 안내를 읽고 행동할 수 있다.');whale()}]])}

function talk(n){let [name,r,x,y,id]=n;if(id==='chief')return chief();if(id==='cook')return cook();if(id==='doctor')return say(name,'의료용 식품은 제가 가져왔어요. 반출 서명을 빠뜨렸죠.\n환자의 개인 사정까지 공개하진 말아 주세요.',[['진료 기록을 확인한다',()=>{clue('medical');know(name,'consulted');sync();close()}],['대화 종료',close]]);

const texts=['돌아가면 고향 바다에서 사진을 찍으려고요. 여기는 창밖이 너무 어두워요.','환기구 소리가 멈추니까 더 불안해요. 평소에는 그렇게 시끄러웠는데.','누구의 잘못인지 먼저 정하지 않았으면 좋겠어요. 사정이 있을 수도 있으니까.','창밖을 보고 있었어요. 아무것도 보이지 않는다는 게 꼭 안전하다는 뜻은 아니죠.','말을 걸어 줘서 고마워요. 혼자 있으면 소리만 더 크게 들려요.'];say(name,s.ch>=5?'당신이 준비한 방법을 끝까지 확인해 주세요. 우리는 여기 있어요.':s.ch>=3?'정전 뒤에는 다들 모여 있었어요. 아무도 혼자 두고 싶지 않아요.':texts[people.indexOf(n)%5])}
function cook(){if(s.f.foodClosed)return say('서은별',s.choices.food==='private'?'의료용 반출이라고 직접 알려줘서 고마워요. 환자 이름 없이 장부를 정정했어요.':s.choices.food==='report'?'전달한 증거로 반출 용도를 확인했어요. 누군가를 의심하기 전에 확인해서 다행이에요.':s.choices.food==='accuse'?'아직 확인되지 않은 의혹이라고 기록했어요. 이름부터 적을 수는 없어요.':'빠진 서명은 미해결로 남았어요. 확인하지 않은 이야기는 퍼뜨리지 않겠어요.');say('서은별','의료용 상자 하나의 반출 서명이 없어요.\n기록과 선반을 확인해 줄래요?',[
['도와주겠다고 약속한다',()=>{s.choices.foodPromise='yes';know('서은별','promise');sync();say('서은별','고마워요. 반출 기록은 왼쪽, 선반은 오른쪽이에요.')}],['맡기 어렵다고 말한다',()=>{s.choices.foodPromise='no';sync();close()}],['조사한 증거를 전달한다',()=>finishFood('report','기록과 의료실 봉투를 전달했다. 은별은 장부를 대조하기 시작한다.'),!s.clues.includes('food')||!s.clues.includes('shelf')],['의료용 반출 사실만 비공개로 설명한다',()=>finishFood('private','환자 이름을 공개하지 않고 필요한 사정만 설명했다.'),!s.clues.includes('medical')],['증거 없이 의료 담당자를 추궁해 달라고 한다',()=>finishFood('accuse','은별은 확정되지 않은 의혹으로 기록했다.')],['나중에 이야기한다',close]])}
function finishFood(v,t){s.choices.food=v;s.f.foodClosed=true;action('food_'+v);know('서은별',v);sync();say('서은별',t)}
const puzzles={sonar:{title:'소나 로그 비교',text:'관측 메모: “짧게 두 번, 길게 한 번.”\n기록과 일치하는 패턴을 선택한다.',opts:['짧게 · 길게 · 짧게','짧게 · 짧게 · 길게','길게 · 짧게 · 길게'],answer:[1],hint:'두 개의 짧은 파형 뒤에 긴 파형이 이어진다.'},map:{title:'외벽 손상 대조',text:'관측창의 손상은 연구동 방향이다.\n도면: A-3 격납고 / B-1 생활동 / C-2 연구동.',opts:['A-3','B-1','C-2'],answer:[2],hint:'연구동의 구획 번호를 선택한다.'},power:{title:'배전 경로 연결',text:'배선 메모: “양쪽 회로는 켜고, 가운데 과부하 회로는 끈다.”',opts:['ON / ON / OFF','ON / OFF / ON','OFF / ON / ON'],answer:[1],hint:'왼쪽 ON, 가운데 OFF, 오른쪽 ON.'},lab:{title:'안전 통로 연결',text:'절차 메모: 보조 통로를 먼저 열고 사람을 이동시킨 뒤, 연구동 격벽을 닫는다.\n조작을 순서대로 선택한다.',opts:['연구동 격벽 닫기','사람 이동','보조 통로 열기'],answer:[2,1,0],hint:'보조 통로 → 사람 → 격벽.'},voice:{title:'손상된 교신 복원',text:'파일 헤더: 01 → 02 → 03.\n잘린 조각을 번호 순서대로 선택한다.',opts:['03 · 돌아가십시오…','01 · 중계기에는 이상이 없습니다…','02 · 저 아래에…'],answer:[1,2,0],hint:'01번 다음 02번, 마지막 03번.'},sub:{title:'잠수정 점검',text:'정비 기록: 압력을 먼저 확인한다. 밸브를 잠근 뒤 전원을 연결한다.',opts:['전원 연결','압력 확인','밸브 잠금'],answer:[1,2,0],hint:'압력 → 밸브 → 전원.'}};
function puzzle(id){if(s.f[id])return say('장치 기록','작업은 이미 완료되었다. 설정은 유지되고 있다.');let p=puzzles[id],seq=s.puzzles[id]||(s.puzzles[id]=[]);show(p.title,p.text+'\n\n선택 순서: '+(seq.map(i=>p.opts[i]).join(' → ')||'없음'),p.opts.map((v,i)=>[v,()=>{seq.push(i);sync();if(p.answer.length===1)check();else puzzle(id)},seq.includes(i)]).concat(p.answer.length>1?[['순서 실행',check,seq.length!==p.answer.length],['선택 초기화',()=>{s.puzzles[id]=[];sync();puzzle(id)}]]:[]).concat([['현장 힌트',()=>show('현장 메모',p.hint,[['다시 조작',()=>puzzle(id)]])],['설정을 보존하고 나가기',()=>{sync();close()}]]),'PROCEDURE / NO TIME LIMIT');function check(){if(JSON.stringify(seq)===JSON.stringify(p.answer))solve(id);else{s.puzzles[id]=[];sync();sound(85,.3);show('안전 인터록','설정이 현장 기록과 맞지 않아 작동하지 않았다.\n사람이나 시설에는 피해가 없다.',[['다시 조작',()=>puzzle(id)],['현장 힌트',()=>show('힌트',p.hint,[['다시 조작',()=>puzzle(id)]])],['나가기',close]])}}}
function solve(id){s.f[id]=true;action('solve_'+id);let text='설정이 저장되었다.';if(['sonar','map','voice'].includes(id))clue(id);if(id==='sonar'){whale();text='짧게 두 번, 길게 한 번.\n기존 자료와 다른 반복 패턴이 기록되었다. 정체는 확정할 수 없다.'}if(id==='map')text='손상 위치는 C-2, 연구동 외벽이다.\n도면에 보조 통로와 수동 격벽이 표시되어 있다.';if(id==='power'){sound(160,.9);text='환기팬이 돌아간다. 연구동 비상 콘솔에도 전력이 들어왔다.'}if(id==='lab'){s.f.labClosed=true;s.f.labSaved=true;know('고예린','rescued');clue('witness');text=(s.f.assist?'태석이 전원을 잡고 당신이 통로를 열었다.\n':'')+'고예린이 보조 통로를 빠져나왔다.\n“울음과 철판 진동은 간격이 달랐어요.”'}if(id==='voice')text='“중계기에는 이상이 없습니다… 저 아래에… 돌아가십시오.”\n그 이후는 손상되어 있다. 그들의 최종 운명은 알 수 없다.';if(id==='sub'){know('박도현','checked');text='박도현이 점검 표시를 직접 확인한다.\n압력과 전원이 안정되었다. 출항은 마지막 대응의 승선 해치에서 수행한다.'}sync();show('작업 완료',text)}
function lab(){if(s.ch<3)return say('비상 콘솔','정상 운전 중이다.\n절차: 보조 통로 개방 → 사람 이동 → 연구동 격벽 닫기.');if(s.f.labClosed)return say('격벽 콘솔',s.f.labSaved?'구조가 완료되었다. 보조 통로가 안전하게 연결되어 있다.':'연구동은 봉쇄되었다. 원격으로 되돌릴 수 없다.');say('고예린 / 인터폰','주 통로가 막혔어요. 보조 통로를 열 수 있나요?',[['구조하겠다고 말한다',()=>{s.choices.rescuePromise='yes';know('고예린','promise');sync();say('고예린','여기서 기다릴게요. 조작 순서를 확인해 주세요.')}],['장치를 실제로 조작한다',()=>s.f.power?puzzle('lab'):say('전력 부족','설비실 배전부터 복구해야 한다.')],['철수하고 구역 봉쇄를 검토한다',()=>show('연구동 봉쇄 확인','봉쇄하면 고예린과 연결이 끊기고 구조 기회를 포기합니다.\n가만히 기다리는 것만으로 이 결과는 발생하지 않습니다.',[['봉쇄를 확정한다',()=>{s.f.sealed=true;s.f.labClosed=true;action('sealLab');know('한서진','sealed');sync();show('닫힌 통로','금속문이 내려온다. 인터폰이 꺼진다.\n이 조치는 관제실에 기록되었다.')}],['구조를 계속한다',lab]])],['일단 닫기',close]])}
function cross(){if(s.f.route)return say('교차 분석','비상 송신 경로가 이미 확보되어 있다.');let missing=['sonar','voice','old'].filter(k=>!s.clues.includes(k));if(missing.length)return say('자료 부족','필요한 기록:\n'+missing.map(k=>evidence[k][0]).join('\n')+'\n\n과거 관측 자료는 연구동에 있다.');if(!s.f.power)return say('전력 부족','설비실 배전을 복구해야 한다.');show('비상 송신 경로','기록 대조 결과 저출력 지향 경로가 남아 있다.\n분석 내용을 통신 담당자에게 전달해야 연결할 수 있다.',[['분석을 전달하고 경로를 연결한다',()=>{clue('route');s.f.route=true;know('김재민','route');action('connectRoute');sync();say('김재민','경로를 연결했어. 마지막에 송신기에서 직접 요청을 보내. 송신 중 외벽을 지탱할 격벽도 필요해.')}],['아직 연결하지 않는다',close]])}
function brace(){if(s.ch<5)return say('수동 하중 분산','최종 비상 대응용 장치.\n내부 배전 → 수동 격벽 닫기 → 하중 분산 유지.\n송신 도중 기지 구조를 지탱한다.');if(s.f.braced)return say('수동 격벽','격벽이 외벽 하중을 나누고 있다. 구조 송신을 유지할 준비가 되었다.');show('하중 분산 장치','외벽 접합부가 변형되어 있다.\n수동 격벽을 고정하면 남은 구조를 지탱할 수 있다.\n위험한 우회 밸브는 외부 수압을 손상 구획으로 전달한다.',[['수동 격벽을 닫고 하중을 분산한다',()=>{s.f.braced=true;action('protectHull');sync();show('격벽 고정','손잡이를 끝까지 돌리자 금속의 울림이 잦아든다.\n구조 송신을 유지할 준비가 되었다.')}],['압력 우회 밸브를 확인한다',()=>show('안전 인터록 경고','강제 개방하면 수압이 손상 구획으로 전달되어 기지가 붕괴할 수 있습니다.',[['취소한다',close],['인터록을 해제하고 강제 개방한다',()=>{action('overridePressure');end('loss')}]])],['나중에 조작한다',close]])}
