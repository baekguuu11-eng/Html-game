function transmit(){if(s.ch<5)return say('비상 송신기',s.f.route?'경로 준비 완료. 한서진에게 최종 대응을 보고한 뒤 직접 송신할 수 있다.':'교차 분석 단말에서 경로를 확보해야 한다.');if(!s.f.route)return say('경로 미확보','소나·마지막 교신·이전 관측 자료를 모아 교차 분석하자.\n지금도 준비할 수 있다.');if(!s.f.braced)return say('구조 경보','설비실 수동 격벽을 먼저 고정해야 송신 경로를 지탱할 수 있다.');show('구조 신호 전송','“ATLAS–7. 구조 요청. 기지 내부 대기.”\n연결된 저출력 경로로 실제 신호를 보냅니다.',[['신호를 전송한다',()=>{s.f.sent=true;action('sendRescue');sync();show('수신 응답','“ATLAS–7, 위치 확인. 격벽을 유지하십시오.”\n잡음 속에서 응답이 돌아온다. 흔들리는 커넥터를 붙잡는다.',[['커넥터를 고정하고 연결을 유지한다',()=>{action('holdConnection');end('rescue')}]])}],['아직 전송하지 않는다',close]])}

function end(kind){s.ending=kind;sync();let labText=s.f.labSaved?'고예린을 보조 통로에서 구조했다.':s.f.sealed?'연구동을 봉쇄해 고예린과 연결이 끊겼다.':'연구동 사건은 미해결이다.';let foodText=s.choices.food==='private'?'의료용 반출 사정을 필요한 사람에게만 전했다.':s.choices.food==='report'?'조사한 증거로 반출 기록을 바로잡았다.':s.choices.food==='accuse'?'확인되지 않은 의혹이 기록에 남았다.':'반출 기록은 미해결로 남았다.';let promise=s.choices.rescuePromise==='yes'&&!s.f.labSaved?'\n구조 약속은 실행되지 않았다.':s.choices.foodPromise==='no'&&['private','report'].includes(s.choices.food)?'\n맡기 어렵다고 말했지만 실제로는 도왔다.':'';let text,heading;if(kind==='rescue'){heading='RESCUE / 구조';text='구조대가 접안했을 때 당신은 여전히 커넥터를 잡고 있었다.\n기지에 남은 사람들은 구조 통로를 따라 이동했다.\n\n상승하는 구조정의 수신기에 짧게 두 번, 길게 한 번 울음이 섞인다.\n그것이 무엇인지는 여전히 알 수 없다.'}else if(kind==='escape'){heading='ESCAPE / 탈출';text='박도현이 출항을 확인한다.\n'+(s.f.labSaved?'고예린도 좁은 좌석에 몸을 기대고 있다.\n':'')+'잠수정이 기지에서 떨어져 나온다.\n창문들이 차례로 어둠 속에 묻힌다.\n\n남은 사람들의 최종 운명은 이 탈출 기록에 담기지 않았다.'}else{heading='TOTAL LOSS / 전원 사망';text='우회 밸브가 열리자 수압이 손상 구획으로 전달된다.\n접합부와 격벽이 연달아 기능을 잃는다.\n\n금속이 휘는 소리.\n경보 중단. 조명 상실.\n\nATLAS–7은 수압으로 붕괴했다.\n주인공을 포함해 기지 잔류 인원 전원은 생존하지 못했다.\n기록은 여기서 끝난다.';sound(65,2,.08,'sawtooth')}
show(heading,text+'\n\n— 이번 기록 —\n'+labText+'\n'+foodText+promise,[['다른 기록 시작',()=>show('새 기록','자동저장을 새 게임으로 대체합니다.',[['시작',newGame],['결말로 돌아가기',()=>end(kind)]])],['제목 화면',title]],'END OF TRANSMISSION')}

function nearby(){let found=null,best=31;[...objs(),...npcList().map(n=>({x:n[2],y:n[3],name:n[0],run:()=>talk(n)}))].forEach(o=>{let d=Math.hypot(s.x-o.x,s.y-o.y);if(d<best){found=o;best=d}});return found}

function powerDevice(){const d=instrumentState('power',{turns:[0,1,1,2,1,0,2,1,2]});function render(){panelUI('끊어진 배전 경로','배선 타일을 눌러 90°씩 회전한다. 왼쪽 위 전원에서 오른쪽 아래 비상 통로까지 선을 연결한다.',p=>{el('div','전원 IN ↘                     ↘ 비상 통로 OUT','readout',p);let grid=el('div',null,'pipe-grid',p),net=connected(d.turns);for(let i=0;i<9;i++){let b=btn(grid,'',()=>{d.turns[i]=(d.turns[i]+1)%4;sync();render()},'pipe '+(net.seen.has(i)?'powered':''));b.setAttribute('aria-label',(Math.floor(i/3)+1)+'행 '+(i%3+1)+'열 배선 회전');let pts=ports(i,d.turns[i]);b.innerHTML='<svg viewBox="0 0 60 60">'+pts.map(k=>'<path d="M30 30 L'+[30,60,30,0][k]+' '+[0,30,60,30][k]+'"/>').join('')+'<circle cx="30" cy="30" r="4"/><\/svg>'}statusBox(p,net.ok?'연결 확인. 차단기를 올려 실제 전력을 공급할 수 있다.':'전기가 흐르는 배선은 청록색으로 표시된다.')},[['차단기를 올린다',()=>connected(d.turns).ok?solve('power'):feedback('출력 단자까지 연결되지 않았다. 빛나는 배선 끝을 따라가 보자.')],['정비사의 우회 배선도',()=>show('태석의 배선도','전원에서 한 칸 아래로 내려가 가운데 줄을 가로지른 다음, 오른쪽 아래 출력으로 연결할 수 있다. 위·아래 연결이 모두 맞아야 통전된다.',[['작업으로',render]])]]);}render()}

function walkRoute(tx,ty,target){let start=[Math.round(s.x/4)*4,Math.round(s.y/4)*4];if(blocked(...start)){notify('방향키로 조금 이동한 뒤 바닥을 다시 눌러 주세요.');return}let q=[start],parents=new Map([[start.join(','),null]]),found=null;for(let i=0;i<q.length;i++){let p=q[i];if(Math.hypot(p[0]-tx,p[1]-ty)<(target?25:5)){found=p;break}for(let [dx,dy] of [[4,0],[-4,0],[0,4],[0,-4]]){let a=[p[0]+dx,p[1]+dy],k=a.join(',');if(!parents.has(k)&&!blocked(...a)){parents.set(k,p);q.push(a)}}}if(!found){notify('그곳까지 걸어갈 수 없다. 통로 쪽 바닥을 눌러 보자.');return}let path=[];for(let p=found;p;p=parents.get(p.join(',')))path.unshift(p);nav={room:s.r,path,target};}
c.onpointerdown=e=>{audio();if(modal||!started||travel)return;const rect=c.getBoundingClientRect(),scale=Math.min(rect.width/480,rect.height/270),x=(e.clientX-rect.left-(rect.width-480*scale)/2)/scale,y=(e.clientY-rect.top-(rect.height-270*scale)/2)/scale;if(x<0||x>480||y<0||y>270)return;let wx=x+(s.r===8?corridorX():0),wy=y;let candidates=objs().concat(npcList().map(n=>({x:n[2],y:n[3],name:n[0],run:()=>talk(n)})));let target=candidates.find(o=>Math.hypot(o.x-wx,o.y-10-wy)<18);if(s.r===8){let d=corridorDoors.find(d=>Math.abs(d.x-wx)<30&&(d.top?y<82:y>198));if(d){wx=d.x;wy=d.top?84:196}}else if(Math.abs(x-240)<30&&y>232){wx=240;wy=232}walkRoute(target?target.x:wx,target?target.y:wy,target)};
const movementFrame=frame;frame=function(t){if(nav){if(modal||travel||s.r!==nav.room){nav=null;keys={}}else{while(nav.path.length&&Math.hypot(s.x-nav.path[0][0],s.y-nav.path[0][1])<3.4)nav.path.shift();if(!nav.path.length){let target=nav.target;nav=null;keys={};if(target&&Math.hypot(s.x-target.x,s.y-target.y)<31)target.run()}else{let [x,y]=nav.path[0];keys={};if(Math.abs(x-s.x)>2)keys[x>s.x?'d':'a']=true;else if(Math.abs(y-s.y)>2)keys[y>s.y?'s':'w']=true}}}movementFrame(t)};
document.addEventListener('keydown',e=>{if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&nav){nav=null;keys={}}},true);
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('pointerdown',()=>{nav=null;keys={}},true));
const bracingOld=brace;
brace=function(){if(s.ch<5||s.f.braced)return bracingOld();const d=instrumentState('brace',{bolts:[0,0,0]});function render(){panelUI('외벽 하중 분산 · 수동 고정','한쪽만 먼저 끝까지 조이면 판이 뒤틀린다. 세 고정쇠를 번갈아 조여 각각 2단에 맞춘 뒤 격벽을 고정한다.',p=>{let row=el('div',null,'device-row',p);d.bolts.forEach((n,i)=>btn(row,['왼쪽','중앙','오른쪽'][i]+' 고정쇠\n'+n+' / 2',()=>{if(n===2)return feedback('이미 고정되어 있다.',true);if(n>Math.min(...d.bolts))return feedback('다른 고정쇠도 같은 깊이로 조인 뒤 계속해야 한다.');d.bolts[i]++;tone('metal');sync();render()}));statusBox(p,'판 전체에 하중을 균등하게 나눈다. 기다린 시간은 상태에 영향을 주지 않는다.')},[['격벽을 고정하고 하중을 분산한다',()=>{if(!d.bolts.every(n=>n===2))return feedback('세 고정쇠를 모두 2단까지 조여야 한다.');s.f.braced=true;action('protectHull');sync();say('윤태석',s.f.assist?'네가 요청한 대로 전원을 잡고 있었어. 하중이 나뉘었어. 이제 신호를 보내.':'고정계에 하중 분산이 표시됐어. 송신 경로를 지탱할 수 있겠어.')}],['압력 우회 장치를 조사한다',()=>show('우회 밸브 / 잠금 상태','격벽 고정을 건너뛰고 외부 수압을 끌어오면 손상 구획이 압력을 견디지 못한다.\n인터록을 해제하는 것은 되돌릴 수 없다.',[['수동 고정을 계속한다',render],['위험을 감수하고 인터록을 해제한다',()=>{action('overridePressure');end('loss')}]])]]);}render()};
const endBase=end;end=function(kind){endBase(kind);const p=$('panel');if(s.f.medKit&&kind!=='loss'){el('p','의료 반출 기록을 바로잡은 뒤, 유리는 필요한 비상 처치 물품을 챙길 수 있었다.','entry',p)}if(kind==='loss')tone('metal')};
const settingsBase=settings;settings=function(){settingsBase();let p=$('panel').querySelector('p');p.textContent='태블릿 / 모바일: 바닥을 터치하면 걸어갑니다. 사람·장치를 터치하면 다가가 조사합니다. 방향키도 사용할 수 있습니다.\nPC: WASD·방향키 이동 / E 조사 / Tab 기록 / Esc 닫기\n대화: 글자가 나오는 중 누르면 전체 표시\n\n시간 제한은 없습니다. 모든 사건은 조작과 선택으로만 바뀝니다.'};
// A small sound cue accompanies every button, with distinct device/door sounds layered above it.
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))tone('click')},true);

hud();title();requestAnimationFrame(frame);
